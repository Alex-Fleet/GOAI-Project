[project]
name = "goai-engine"
version = "0.1.0"
description = "GOAI 一楼：通用分层溯源 Agent + 平台（行业无关）"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 行宽交给格式化

[tool.ruff.format]
quote-style = "double"
